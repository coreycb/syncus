[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "syncus"
version = "0.1.0"
description = "Sync git working-tree changes between the host and an Incus container"
readme = "README.md"
requires-python = ">=3.9"

[project.scripts]
syncus = "syncus:main"

[tool.setuptools]
py-modules = ["syncus"]
